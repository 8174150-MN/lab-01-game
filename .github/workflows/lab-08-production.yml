name: Lab 8 production checks

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run coverage:shared
      - run: npm run build
      - run: npm run production:smoke
      - run: npm run chaos:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --build-arg BUILD_SHA=${GITHUB_SHA} --build-arg BUILD_VERSION=ci -t asteroids-game:lab-08 .
      - name: Check the image is below 200 MB
        run: |
          image_bytes=$(docker image inspect asteroids-game:lab-08 --format '{{.Size}}')
          echo "Production image size: ${image_bytes} bytes"
          test "$image_bytes" -lt 209715200
      - name: Start the production container
        run: docker run -d --name asteroids-lab8 -p 3000:3000 -e ALLOWED_ORIGINS=http://localhost:3000 asteroids-game:lab-08
      - name: Check readiness, health, metrics, and PWA files
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "${ready:-0}" -eq 1
          curl -fsS http://127.0.0.1:3000/health | node -e "let data=''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => { const health = JSON.parse(data); if (health.status !== 'ok' || health.version !== 'ci' || health.gitSha !== process.env.GITHUB_SHA) process.exit(1); console.log('Health build stamp:', health.version, health.gitSha); });"
          curl -fsS http://127.0.0.1:3000/metrics
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | node -e "let data=''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => { const manifest = JSON.parse(data); if (!manifest.icons?.some((icon) => icon.sizes === '192x192' && icon.type === 'image/png') || !manifest.icons?.some((icon) => icon.sizes === '512x512' && icon.type === 'image/png')) process.exit(1); console.log('PWA manifest:', manifest.name); });"
          curl --fail --silent --show-error http://127.0.0.1:3000/pwa-icon-192.png --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/pwa-icon-512.png --output /dev/null
      - name: Check graceful Docker stop
        run: |
          set +e
          node scripts/docker-stop-check.mjs asteroids-lab8 > /tmp/docker-stop-check.log 2>&1
          check_result=$?
          if [ "$check_result" -ne 0 ]; then
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error title=Graceful Docker stop check::${escaped}"
            done < /tmp/docker-stop-check.log
          else
            cat /tmp/docker-stop-check.log
          fi
          test "$check_result" -eq 0
          exit_code=$(docker inspect asteroids-lab8 --format '{{.State.ExitCode}}')
          test "$exit_code" -eq 0
      - name: Sign in to GHCR for the Render preview image
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab-07-v8-testing'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested preview image for Render setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab-07-v8-testing'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:lab-08-preview"
          docker tag asteroids-game:lab-08 "$image"
          docker push "$image"
      - name: Add container shutdown diagnostics to the job summary
        if: failure()
        run: |
          state=$(docker inspect asteroids-lab8 --format '{{json .State}}' 2>&1 || true)
          echo "::error title=Docker container state::${state}"
          docker logs --tail 40 asteroids-lab8 2>&1 | while IFS= read -r line; do
            escaped=${line//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            echo "::error title=Recent Node server log::${escaped}"
          done
          {
            echo '## Docker shutdown diagnostics'
            echo "Container state: ${state}"
            echo 'Recent Node server logs:'
            docker logs --tail 40 asteroids-lab8 2>&1 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the test container
        if: always()
        run: docker rm --force asteroids-lab8 || true
