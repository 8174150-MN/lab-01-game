name: Lab 8 production checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run coverage:shared
      - run: npm run build
      - run: npm run production:smoke
      - run: npm run chaos:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --build-arg BUILD_SHA=${GITHUB_SHA} --build-arg BUILD_VERSION=ci -t asteroids-game:lab-08 .
      - name: Check the image is below 200 MB
        run: |
          image_bytes=$(docker image inspect asteroids-game:lab-08 --format '{{.Size}}')
          echo "Production image size: ${image_bytes} bytes"
          test "$image_bytes" -lt 209715200
      - name: Check health, readiness, metrics, PWA, and graceful Docker stop
        run: |
          docker run -d --name asteroids-lab8 -p 3000:3000 -e ALLOWED_ORIGINS=http://localhost:3000 asteroids-game:lab-08
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "${ready:-0}" -eq 1
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/metrics
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | node -e "let data=''; process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => { const manifest = JSON.parse(data); if (!manifest.icons?.some((icon) => icon.sizes === '192x192' && icon.type === 'image/png') || !manifest.icons?.some((icon) => icon.sizes === '512x512' && icon.type === 'image/png')) process.exit(1); console.log('PWA manifest:', manifest.name); });"
          node scripts/docker-stop-check.mjs asteroids-lab8
          exit_code=$(docker inspect asteroids-lab8 --format '{{.State.ExitCode}}')
          test "$exit_code" -eq 0
          docker rm asteroids-lab8
