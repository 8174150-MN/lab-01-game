<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroids Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0c10;
      font-family: monospace, sans-serif;
      color: #fff;
    }

    /* 1. Ігрове полотно Canvas */
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 2. Верхня панель HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      z-index: 10;
      text-shadow: 1px 1px 2px #000;
    }

    /* 3. Екран Лобі: Повністю непрозорий фон та чітка вертикальна колонка */
    #lobby {
      position: absolute;
      inset: 0;
      background: #0b0c10; /* Суцільний темний фон (астероїди ззаду більше не просвічують) */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
    }

    /* Заголовок лобі */
    #lobby h1, #lobby h2 {
      margin-bottom: 15px;
      color: #66fcf1;
      font-size: 24px;
      text-align: center;
    }

    /* Текстові підписи та блоки всередині лобі */
    #lobby label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      font-size: 15px;
      color: #c5c6c7;
    }

    /* Поля введення даних */
    #lobby input[type="text"], #lobby select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #45a29e;
      background: #1f2833;
      color: #fff;
      outline: none;
    }

    /* Список кімнат */
    #lobby ul {
      list-style: none;
      padding: 0;
      margin: 15px 0;
      width: 100%;
      max-width: 300px;
    }

    #lobby li {
      padding: 10px 14px;
      background: #1f2833;
      border: 1px solid #45a29e;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    #lobby li:hover {
      background: #2c3531;
    }

    /* Кнопки в лобі */
    #lobby button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      background: #45a29e;
      color: #0b0c10;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    #lobby button:hover {
      background: #66fcf1;
    }

    /* Допоміжний текст оновлення */
    #lobby p {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    /* 4. Екран помилки завантаження */
    #errorScreen {
      position: absolute;
      inset: 0;
      background: #1f0808;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      padding: 20px;
    }

    /* 5. Вікно чату: Приховане за замовчуванням (display: none) */
    #chatBox {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 320px;
      background: rgba(15, 16, 22, 0.95);
      border: 1px solid #45a29e;
      border-radius: 8px;
      padding: 12px;
      z-index: 15;
      display: none; /* Чат з'явиться тільки після входу в гру */
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #chatMessages {
      height: 120px;
      overflow-y: auto;
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.4;
      padding-right: 5px;
    }

    #chatForm {
      display: flex;
      gap: 6px;
    }

    #chatInput {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #45a29e;
      background: #1f2833;
      color: #fff;
      font-family: inherit;
    }

    #chatForm button {
      padding: 8px 14px;
      background: #45a29e;
      border: none;
      color: #0b0c10;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #chatForm button:hover {
      background: #66fcf1;
    }
  </style>
</head>
<body>

  <!-- Верхня панель HUD -->
  <div id="hud"></div>

  <!-- Головне полотно гри -->
  <canvas id="gameCanvas"></canvas>

  <!-- Контейнер Лобі -->
  <div id="lobby"></div>

  <!-- Екран помилки -->
  <div id="errorScreen"></div>

  <!-- Чат оверлей (з'являється під час гри) -->
  <div id="chatBox">
    <div id="chatMessages"></div>
    <form id="chatForm">
      <input type="text" id="chatInput" placeholder="Напишіть у чат..." autocomplete="off" required />
      <button type="submit">➔</button>
    </form>
  </div>

  <!-- Головний модуль JS -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
