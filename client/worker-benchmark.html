<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 7 Worker experiment</title>
    <style>
      /* Keep the diagnostic page readable without changing the game styles. */
      body {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 18px;
        background: #0b0c10;
        color: #e6e6e6;
        font:
          16px system-ui,
          sans-serif;
      }
      /* Make the one action button easy to find. */
      button {
        padding: 10px 18px;
        background: #66fcf1;
        border: 0;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      /* Preserve line breaks in the JSON measurement result. */
      pre {
        white-space: pre-wrap;
        background: #151923;
        padding: 16px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Перевірка Web Worker</h1>
    <!-- Називаємо окрему лабораторну сторінку. -->
    <p>Однаковий набір команд для восьми ботів рахується спочатку на головному потоці, а потім у Worker.</p>
    <!-- Пояснюємо, що саме порівнюється. -->
    <p>
      Зверни увагу на затримку таймера інтерфейсу. Worker лишаємо в самій грі лише тоді, коли ця затримка справді менша.
    </p>
    <!-- Пояснюємо критерій висновку. -->
    <button id="run">Почати вимір</button>
    <!-- Кнопка запускає обидва варіанти обчислення. -->
    <pre id="result">Натисни кнопку, щоб запустити вимір.</pre>
    <!-- Тут сторінка покаже фактичні мілісекунди. -->
    <script type="module" src="/src/diagnostics/worker-benchmark.ts"></script>
    <!-- Підключаємо типізований код вимірювання. -->
  </body>
</html>
