<!DOCTYPE html>
<html lang="uk">
  <head>
    <!-- Кодування символів, щоб українські літери відображались правильно -->
    <meta charset="UTF-8" />
    <!-- Налаштування для мобільних екранів -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroids</title>
    <style>
      /* Прибираємо відступи й смуги прокручування, фон чорний */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      /* Canvas займає весь екран */
      #gameCanvas {
        display: block;
      }
      /* HUD (життя й рахунок) лежить поверх canvas у лівому верхньому куті */
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #fff;
        font-family: monospace;
        font-size: 16px;
      }
        /* Лобі: затемнений екран поверх гри */
      #lobby {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: rgba(0, 0, 0, 0.85);
        color: #fff; font-family: monospace;
      }
      /* Без цього атрибут hidden не спрацює, бо display: flex сильніший */
      #lobby[hidden] { display: none; }
      #lobby ul { list-style: none; padding: 0; margin: 0; }
      #lobby li { margin: 6px 0; }
    /* Екран помилки завантаження */
      #errorScreen {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #000; color: #fff; font-family: monospace;
      }
      #errorScreen[hidden] { display: none; }
    </style>
  </head>
  <body>
    <!-- Ігрове поле: main.js шукає його за id "gameCanvas" -->
    <canvas id="gameCanvas"></canvas>

    <!-- Текстова панель: main.js шукає її за id "hud" -->
    <div id="hud"></div>
        <!-- Лобі: його наповнює ui/lobby.js -->
    <div id="lobby" hidden></div>
    <div id="errorScreen" hidden></div>


    <!-- Підключаємо main.js як модуль (потрібно для import/export) -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
